<svg width="1280" height="230" viewBox="0 0 1280 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .float { animation: float 5.5s ease-in-out infinite; transform-origin:center; }
      .glide { stroke-dasharray: 18 18; animation: dash 18s linear infinite; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; transform-origin:center; }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.8} }
    </style>
  </defs>

  <rect width="1280" height="230" rx="34" fill="url(#bg)"/>
  <circle cx="120" cy="45" r="80" fill="#38BDF8" opacity=".10" class="pulse"/>
  <circle cx="1145" cy="185" r="110" fill="#8B5CF6" opacity=".12" class="pulse"/>

  <g class="float" filter="url(#shadow)">
    <rect x="180" y="50" width="920" height="120" rx="30" fill="#0B1220" stroke="#334155" stroke-width="1.4"/>
    <path d="M230 116 C340 60, 430 170, 548 111 S750 55, 862 112 S1000 165, 1050 92" fill="none" stroke="url(#line)" stroke-width="3.2" opacity=".92" filter="url(#glow)"/>
    <path class="glide" d="M230 116 C340 60, 430 170, 548 111 S750 55, 862 112 S1000 165, 1050 92" fill="none" stroke="#BAE6FD" stroke-width="1.2" opacity=".55"/>
    <text x="640" y="100" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial" font-size="28" font-weight="900">Learning • Building • Shipping • Solving • Improving</text>
    <text x="640" y="135" text-anchor="middle" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700" letter-spacing="1.1">KUBERNETES • AWS • CI/CD • VAULT • OBSERVABILITY • COMPETITIVE PROGRAMMING</text>
  </g>

  <g filter="url(#glow)">
    <circle cx="240" cy="70" r="5" fill="#38BDF8"><animate attributeName="cy" values="70;60;70" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="158" r="5" fill="#22C55E"><animate attributeName="cy" values="158;146;158" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="62" r="4" fill="#8B5CF6"><animate attributeName="cy" values="62;52;62" dur="4.7s" repeatCount="indefinite"/></circle>
  </g>
</svg>