<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="240" viewBox="0 0 1600 240" role="img" aria-label="Professional GitHub profile footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0a1731"/>
      <stop offset="100%" stop-color="#152f62"/>
    </linearGradient>

```
<radialGradient id="leftGlow" cx="0.12" cy="0.88" r="0.55">
  <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.24"/>
  <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
</radialGradient>

<radialGradient id="rightGlow" cx="0.90" cy="0.12" r="0.44">
  <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.16"/>
  <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
</radialGradient>

<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
  <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
</pattern>

<linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
  <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.9"/>
  <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.95"/>
  <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.12"/>
</linearGradient>

<linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0f172a" stop-opacity="0.96"/>
  <stop offset="100%" stop-color="#0b1220" stop-opacity="0.96"/>
</linearGradient>

<filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
  <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.48"/>
</filter>

<filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#020617" flood-opacity="0.70"/>
</filter>

<style>
  .small {
    font: 700 17px 'Inter','Segoe UI',Arial,sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    fill: #bae6fd;
  }
  .main {
    font: 900 38px 'Inter','Segoe UI',Arial,sans-serif;
    letter-spacing: -0.025em;
    fill: #fffaf5;
  }
  .sub {
    font: 700 20px 'Inter','Segoe UI',Arial,sans-serif;
    fill: #cbd5e1;
  }
  .mini {
    font: 700 16px 'Inter','Segoe UI',Arial,sans-serif;
    fill: #93c5fd;
  }
</style>
```

  </defs>

  <!-- Background -->

  <rect x="12" y="12" width="1576" height="216" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="12" y="12" width="1576" height="216" rx="34" fill="url(#grid)"/>
  <rect x="12" y="12" width="1576" height="216" rx="34" fill="url(#leftGlow)"/>
  <rect x="12" y="12" width="1576" height="216" rx="34" fill="url(#rightGlow)"/>

  <!-- Main footer card -->

  <g filter="url(#shadow)">
    <rect x="130" y="50" width="1340" height="140" rx="30" fill="url(#cardFill)" stroke="#334155" stroke-opacity="0.85"/>
    <line x1="190" y1="78" x2="1410" y2="78" stroke="url(#accentLine)" stroke-width="3" stroke-linecap="round"/>

```
<text x="800" y="72" text-anchor="middle" class="small" filter="url(#textShadow)">
  Thanks for visiting
</text>

<text x="800" y="122" text-anchor="middle" class="main" filter="url(#textShadow)">
  Keep building. Keep learning. Keep improving.
</text>

<text x="800" y="154" text-anchor="middle" class="sub" filter="url(#textShadow)">
  Use systems intentionally — never be used by a system.
</text>
```

  </g>

  <!-- Bottom closing line -->

  <text x="800" y="214" text-anchor="middle" class="mini" filter="url(#textShadow)">
    Think clearly • Ship reliably • Solve consistently
  </text>
</svg>
