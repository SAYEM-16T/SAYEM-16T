<svg width="1400" height="470" viewBox="0 0 1400 470" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1400" y2="470"><stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="line" x1="80" y1="0" x2="1320" y2="0"><stop stop-color="#38bdf8"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1400" height="470" rx="28" fill="url(#bg)"/>
<text x="700" y="62" text-anchor="middle" font-family="Inter, Segoe UI, Arial" font-size="36" font-weight="800" fill="#f8fafc">DevOps Delivery Workflow</text>
<text x="700" y="99" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="17" fill="#94a3b8">Developer Push → CI/CD → Image → GitOps → Kubernetes → Vault → Observability</text>
<path d="M170 240 H1230" stroke="url(#line)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
<circle r="10" fill="#ffffff" filter="url(#glow)">
