    <rect x="270" y="180" width="150" height="84" rx="18" fill="url(#box)" stroke="#38bdf8"/><text x="345" y="216" text-anchor="middle">GitLab CI</text><text x="345" y="242" text-anchor="middle" font-size="14" fill="#cbd5e1">Parallel Pipeline</text>
    <rect x="470" y="180" width="150" height="84" rx="18" fill="url(#box)" stroke="#38bdf8"/><text x="545" y="216" text-anchor="middle">Docker</text><text x="545" y="242" text-anchor="middle" font-size="14" fill="#cbd5e1">Build Image</text>
    <rect x="670" y="180" width="150" height="84" rx="18" fill="url(#box)" stroke="#38bdf8"/><text x="745" y="216" text-anchor="middle">ArgoCD</text><text x="745" y="242" text-anchor="middle" font-size="14" fill="#cbd5e1">GitOps Sync</text>
    <rect x="870" y="180" width="150" height="84" rx="18" fill="url(#box)" stroke="#38bdf8"/><text x="945" y="216" text-anchor="middle">Kubernetes</text><text x="945" y="242" text-anchor="middle" font-size="14" fill="#cbd5e1">Deploy Services</text>
    <rect x="1070" y="180" width="150" height="84" rx="18" fill="url(#box)" stroke="#38bdf8"/><text x="1145" y="216" text-anchor="middle">Vault</text><text x="1145" y="242" text-anchor="middle" font-size="14" fill="#cbd5e1">Secrets Flow</text>
    <path d="M220 222H270" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M420 222H470" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 222H670" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M820 222H870" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M1020 222H1070" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
