<svg width="1280" height="520" viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker></defs>
<rect width="1280" height="520" rx="30" fill="url(#bg)"/>
<text x="640" y="58" text-anchor="middle" fill="white" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900">DevOps Delivery Flow</text>
<text x="640" y="92" text-anchor="middle" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="600">from developer changes to reliable Kubernetes delivery and observability</text>
<g font-family="Inter,Segoe UI,Arial" font-weight="800" font-size="16">
  <g transform="translate(60 165)"><rect width="150" height="80" rx="18" fill="url(#card)" stroke="#38BDF8"/><text x="75" y="36" text-anchor="middle" fill="white">Developer</text><text x="75" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">push/merge</text></g>
  <g transform="translate(255 165)"><rect width="160" height="80" rx="18" fill="url(#card)" stroke="#A78BFA"/><text x="80" y="34" text-anchor="middle" fill="white">GitLab CI/CD</text><text x="80" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">parallel pipelines</text></g>
  <g transform="translate(460 165)"><rect width="150" height="80" rx="18" fill="url(#card)" stroke="#22C55E"/><text x="75" y="34" text-anchor="middle" fill="white">Docker Image</text><text x="75" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">build & release</text></g>
  <g transform="translate(655 165)"><rect width="145" height="80" rx="18" fill="url(#card)" stroke="#F97316"/><text x="72" y="34" text-anchor="middle" fill="white">ArgoCD</text><text x="72" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">GitOps sync</text></g>
  <g transform="translate(845 165)"><rect width="165" height="80" rx="18" fill="url(#card)" stroke="#60A5FA"/><text x="82" y="34" text-anchor="middle" fill="white">Kubernetes</text><text x="82" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">deploy/manage</text></g>
  <g transform="translate(1055 165)"><rect width="160" height="80" rx="18" fill="url(#card)" stroke="#EF4444"/><text x="80" y="34" text-anchor="middle" fill="white">Users/API</text><text x="80" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">gateway/gRPC</text></g>
</g>
<g stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"><path d="M215 205 H247"/><path d="M418 205 H452"/><path d="M612 205 H647"/><path d="M802 205 H837"/><path d="M1012 205 H1047"/></g>
<g font-family="Inter,Segoe UI,Arial" font-weight="800" font-size="16">
  <g transform="translate(280 345)"><rect width="170" height="76" rx="18" fill="#0B1220" stroke="#8B5CF6"/><text x="85" y="32" fill="white" text-anchor="middle">Vault</text><text x="85" y="55" fill="#94A3B8" text-anchor="middle" font-size="12">secure secrets</text></g>
  <g transform="translate(555 345)"><rect width="170" height="76" rx="18" fill="#0B1220" stroke="#F97316"/><text x="85" y="32" fill="white" text-anchor="middle">Grafana</text><text x="85" y="55" fill="#94A3B8" text-anchor="middle" font-size="12">service graphs</text></g>
  <g transform="translate(825 345)"><rect width="170" height="76" rx="18" fill="#0B1220" stroke="#22C55E"/><text x="85" y="32" fill="white" text-anchor="middle">ELK / EFK</text><text x="85" y="55" fill="#94A3B8" text-anchor="middle" font-size="12">logs & search</text></g>
</g>
