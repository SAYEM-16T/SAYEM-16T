  </defs>
  <rect width="1300" height="520" rx="30" fill="url(#bg)" stroke="#334155"/>
  <text x="650" y="60" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="900" fill="#ffffff">Cloud-Native DevOps Workflow</text>
  <text x="650" y="96" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="#94a3b8">Code → Pipeline → GitOps → Kubernetes → Secrets → Observability → Reliability</text>
  <g font-family="Segoe UI, Arial" font-weight="800" font-size="18" fill="#ffffff">
