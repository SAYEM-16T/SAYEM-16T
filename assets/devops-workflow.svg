<svg width="1300" height="520" viewBox="0 0 1300 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1300" y1="0" y2="520"><stop stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="box" x1="0" x2="1"><stop stop-color="#0ea5e9" stop-opacity="0.22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.22"/></linearGradient>
