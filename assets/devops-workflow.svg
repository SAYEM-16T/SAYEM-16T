<svg width="1280" height="520" viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DevOps Delivery Workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/>
    </marker>
    <style>
      .node { filter: drop-shadow(0px 10px 18px rgba(0,0,0,.35)); }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; animation-delay: .5s; }
      .dash { stroke-dasharray: 10 12; animation: dash 18s linear infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out infinite; animation-delay: .7s; }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%,100%{opacity:.72; transform:scale(1)} 50%{opacity:1; transform:scale(1.045)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    </style>
  </defs>

  <rect width="1280" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="118" cy="85" r="75" fill="#2563EB" opacity=".11" class="pulse"/>
  <circle cx="1138" cy="420" r="110" fill="#7C3AED" opacity=".12" class="pulse2"/>

  <text x="640" y="58" text-anchor="middle" fill="white" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900">DevOps Delivery Workflow</text>
  <text x="640" y="92" text-anchor="middle" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="600">Developer change → CI/CD → GitOps → Kubernetes → Observability</text>

  <g font-family="Inter,Segoe UI,Arial" font-weight="800" font-size="16">
    <g transform="translate(60 165)" class="node float"><rect width="150" height="80" rx="18" fill="url(#card)" stroke="#38BDF8"/><text x="75" y="36" text-anchor="middle" fill="white">Developer</text><text x="75" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">push / merge</text></g>
    <g transform="translate(255 165)" class="node float2"><rect width="160" height="80" rx="18" fill="url(#card)" stroke="#A78BFA"/><text x="80" y="34" text-anchor="middle" fill="white">GitLab CI/CD</text><text x="80" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">parallel pipeline</text></g>
    <g transform="translate(460 165)" class="node float"><rect width="150" height="80" rx="18" fill="url(#card)" stroke="#22C55E"/><text x="75" y="34" text-anchor="middle" fill="white">Docker Image</text><text x="75" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">build &amp; release</text></g>
    <g transform="translate(655 165)" class="node float2"><rect width="145" height="80" rx="18" fill="url(#card)" stroke="#F97316"/><text x="72" y="34" text-anchor="middle" fill="white">ArgoCD</text><text x="72" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">GitOps sync</text></g>
    <g transform="translate(845 165)" class="node float"><rect width="165" height="80" rx="18" fill="url(#card)" stroke="#60A5FA"/><text x="82" y="34" text-anchor="middle" fill="white">Kubernetes</text><text x="82" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">deploy / manage</text></g>
    <g transform="translate(1055 165)" class="node float2"><rect width="160" height="80" rx="18" fill="url(#card)" stroke="#EF4444"/><text x="80" y="34" text-anchor="middle" fill="white">Users / API</text><text x="80" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">gateway / gRPC</text></g>
  </g>

  <g stroke="url(#flow)" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)">
    <path d="M215 205 H247"/><path d="M418 205 H452"/><path d="M612 205 H647"/><path d="M802 205 H837"/><path d="M1012 205 H1047"/>
  </g>
  <g stroke="#38BDF8" stroke-width="2" opacity=".75" class="dash">
    <path d="M215 205 H247"/><path d="M418 205 H452"/><path d="M612 205 H647"/><path d="M802 205 H837"/><path d="M1012 205 H1047"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial" font-weight="800" font-size="16">
    <g transform="translate(280 345)" class="node float2"><rect width="170" height="76" rx="18" fill="#0B1220" stroke="#8B5CF6"/><text x="85" y="32" fill="white" text-anchor="middle">Vault</text><text x="85" y="55" fill="#94A3B8" text-anchor="middle" font-size="12">secure secrets</text></g>
    <g transform="translate(555 345)" class="node float"><rect width="170" height="76" rx="18" fill="#0B1220" stroke="#F97316"/><text x="85" y="32" fill="white" text-anchor="middle">Grafana</text><text x="85" y="55" fill="#94A3B8" text-anchor="middle" font-size="12">service graphs</text></g>
    <g transform="translate(825 345)" class="node float2"><rect width="170" height="76" rx="18" fill="#0B1220" stroke="#22C55E"/><text x="85" y="32" fill="white" text-anchor="middle">ELK / EFK</text><text x="85" y="55" fill="#94A3B8" text-anchor="middle" font-size="12">logs &amp; search</text></g>
  </g>
  <g stroke="#64748B" stroke-width="2" stroke-dasharray="8 8" opacity=".8">
    <path d="M925 248 C830 315, 670 310, 640 345"/><path d="M925 248 C780 330, 455 300, 365 345"/><path d="M925 248 C935 320, 925 320, 910 345"/>
  </g>
</svg>