</circle>
<g font-family="Inter, Segoe UI, Arial" font-weight="800" font-size="18" text-anchor="middle">
  <g transform="translate(170 240)"><circle r="64" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><text y="-6" fill="#f8fafc">Git</text><text y="24" fill="#94a3b8" font-size="14">Push</text></g>
  <g transform="translate(345 240)"><circle r="64" fill="#0f172a" stroke="#f97316" stroke-width="3"/><text y="-6" fill="#f8fafc">CI/CD</text><text y="24" fill="#94a3b8" font-size="14">Parallel</text></g>
  <g transform="translate(520 240)"><circle r="64" fill="#0f172a" stroke="#0ea5e9" stroke-width="3"/><text y="-6" fill="#f8fafc">Docker</text><text y="24" fill="#94a3b8" font-size="14">Image</text></g>
  <g transform="translate(695 240)"><circle r="64" fill="#0f172a" stroke="#ef4444" stroke-width="3"/><text y="-6" fill="#f8fafc">ArgoCD</text><text y="24" fill="#94a3b8" font-size="14">GitOps</text></g>
  <g transform="translate(870 240)"><circle r="64" fill="#0f172a" stroke="#326ce5" stroke-width="3"/><text y="-6" fill="#f8fafc">K8s</text><text y="24" fill="#94a3b8" font-size="14">Deploy</text></g>
  <g transform="translate(1045 240)"><circle r="64" fill="#0f172a" stroke="#22c55e" stroke-width="3"/><text y="-6" fill="#f8fafc">Vault</text><text y="24" fill="#94a3b8" font-size="14">Secrets</text></g>
  <g transform="translate(1220 240)"><circle r="64" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/><text y="-6" fill="#f8fafc">Grafana</text><text y="24" fill="#94a3b8" font-size="14">ELK/EFK</text></g>
