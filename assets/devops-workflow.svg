    <g transform="translate(401 128)"><rect width="150" height="96" rx="18" fill="#0f172a" stroke="#22d3ee"/><text x="75" y="40" fill="#cffafe" text-anchor="middle" font-size="17" font-weight="800">Docker</text><text x="75" y="65" fill="#94a3b8" text-anchor="middle" font-size="13">Container Image</text></g>
