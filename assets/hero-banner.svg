<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#0a1731"/>
      <stop offset="100%" stop-color="#152f62"/>
    </linearGradient>

    <radialGradient id="purpleGlow" cx="0.12" cy="0.88" r="0.55">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="0.90" cy="0.12" r="0.44">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="62%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="cardBorder1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4f8cff"/>
    </linearGradient>

    <linearGradient id="cardBorder2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.46"/>
    </filter>

    <style>
      .eyebrow { font: 700 24px 'Inter','Segoe UI',Arial,sans-serif; letter-spacing: 0.18em; text-transform: uppercase; fill: #e2e8f0; }
      .name { font: 800 72px 'Inter','Segoe UI',Arial,sans-serif; letter-spacing: -0.03em; fill: #fffaf5; }
      .role { font: 700 40px 'Inter','Segoe UI',Arial,sans-serif; fill: #dbeafe; }
      .stack { font: 600 24px 'Inter','Segoe UI',Arial,sans-serif; fill: #cbd5e1; }
      .pill { font: 700 18px 'Inter','Segoe UI',Arial,sans-serif; fill: #ffffff; }
      .cardTitle { font: 800 28px 'Inter','Segoe UI',Arial,sans-serif; }
      .cardMeta { font: 700 18px 'Inter','Segoe UI',Arial,sans-serif; fill: #e5e7eb; }
      .cardLine { font: 600 17px 'Inter','Segoe UI',Arial,sans-serif; fill: #cbd5e1; }
      .cardHint { font: 600 15px 'Inter','Segoe UI',Arial,sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect x="12" y="12" width="1576" height="476" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="12" y="12" width="1576" height="476" rx="34" fill="url(#grid)"/>
  <rect x="12" y="12" width="1576" height="476" rx="34" fill="url(#purpleGlow)"/>
  <rect x="12" y="12" width="1576" height="476" rx="34" fill="url(#blueGlow)"/>

  <circle cx="130" cy="430" r="250" fill="#7c3aed" opacity="0.10"/>
  <circle cx="1435" cy="95" r="220" fill="#60a5fa" opacity="0.10"/>

  <text x="86" y="92" class="eyebrow">Cloud-Native DevOps • Kubernetes • AWS • CI/CD</text>
  <text x="86" y="182" class="name">Md. Abu Sayem Rony</text>
  <text x="86" y="242" class="role">Junior DevOps Engineer @ Foodi</text>
  <text x="86" y="294" class="stack">Kubernetes • AWS • Linux • Docker • GitLab CI/CD • ArgoCD • Vault • Grafana • ELK/EFK</text>

  <g transform="translate(86 344)">
    <g><rect width="126" height="42" rx="21" fill="#0ea5e9"/><text x="63" y="27" text-anchor="middle" class="pill">Kubernetes</text></g>
    <g transform="translate(140 0)"><rect width="98" height="42" rx="21" fill="#f59e0b"/><text x="49" y="27" text-anchor="middle" class="pill">AWS</text></g>
    <g transform="translate(252 0)"><rect width="106" height="42" rx="21" fill="#22c55e"/><text x="53" y="27" text-anchor="middle" class="pill">CI/CD</text></g>
    <g transform="translate(372 0)"><rect width="102" height="42" rx="21" fill="#8b5cf6"/><text x="51" y="27" text-anchor="middle" class="pill">Vault</text></g>
    <g transform="translate(488 0)"><rect width="116" height="42" rx="21" fill="#ef4444"/><text x="58" y="27" text-anchor="middle" class="pill">Grafana</text></g>
  </g>

  <path d="M 365 355 C 520 200, 710 180, 900 255 S 1180 330, 1456 214" fill="none" stroke="url(#accentLine)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 398 378 C 560 255, 736 235, 922 297 S 1180 348, 1428 246" fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>
</svg>
