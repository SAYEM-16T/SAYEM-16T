<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#334155" stroke-opacity="0.27" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="28" fill="url(#grid)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="44 44" dur="18s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0.45" filter="url(#glow)">
    <circle cx="170" cy="95" r="85" fill="#0ea5e9"><animate attributeName="r" values="70;95;70" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="250" r="95" fill="#7c3aed"><animate attributeName="r" values="80;115;80" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="340" r="95" fill="#22c55e" opacity="0.45"><animate attributeName="r" values="65;100;65" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="60" y="52" width="1280" height="256" rx="24" fill="#020617" fill-opacity="0.62" stroke="url(#accent)" stroke-width="2"/>
  <path d="M100 92H1300" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dasharray" values="0 1200;450 750;1200 0" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="700" y="146" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">Md. Abu Sayem Rony</text>
  <text x="700" y="193" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="25" font-weight="700" fill="#38bdf8">Junior DevOps Engineer @ Foodi</text>
  <text x="700" y="232" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#c4b5fd">Kubernetes • AWS • CI/CD • Vault • Grafana • ELK/EFK • Competitive Programming</text>
  <text x="700" y="270" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="18" fill="#86efac">Deploy reliably. Observe deeply. Secure secrets. Solve under pressure.</text>
  <g transform="translate(108 250)">
    <rect width="1184" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
    <rect width="260" height="28" rx="14" fill="url(#accent)" opacity="0.85">
      <animate attributeName="x" values="0;924;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
