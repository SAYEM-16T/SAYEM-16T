<svg width="1280" height="440" viewBox="0 0 1280 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub analytics overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38BDF8"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      .bar { animation: grow 2.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
      .bar2 { animation-delay:.3s } .bar3 { animation-delay:.6s } .bar4 { animation-delay:.9s }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes grow { from{ transform:scaleY(.55); opacity:.72 } to{ transform:scaleY(1); opacity:1 } }
      @keyframes pulse { 0%,100%{opacity:.55} 50%{opacity:1} }
    </style>
  </defs>
  <rect width="1280" height="440" rx="30" fill="url(#bg)"/>
  <text x="640" y="58" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="32" font-weight="900">GitHub Engineering Activity</text>
  <text x="640" y="88" text-anchor="middle" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">code • infrastructure notes • learning labs • competitive programming</text>

  <g filter="url(#shadow)">
    <rect x="90" y="125" width="245" height="110" rx="24" fill="#0B1220" stroke="#334155"/>
    <text x="212" y="168" text-anchor="middle" fill="#38BDF8" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900">38+</text>
    <text x="212" y="202" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">Repositories</text>

    <rect x="380" y="125" width="245" height="110" rx="24" fill="#0B1220" stroke="#334155"/>
    <text x="502" y="168" text-anchor="middle" fill="#A78BFA" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900">DevOps</text>
    <text x="502" y="202" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">Profile Direction</text>

    <rect x="670" y="125" width="245" height="110" rx="24" fill="#0B1220" stroke="#334155"/>
    <text x="792" y="168" text-anchor="middle" fill="#22C55E" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900">CP</text>
    <text x="792" y="202" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">Problem Solving Core</text>

    <rect x="960" y="125" width="230" height="110" rx="24" fill="#0B1220" stroke="#334155"/>
    <text x="1075" y="168" text-anchor="middle" fill="#F59E0B" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="900">Ship</text>
    <text x="1075" y="202" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700">Build • Learn • Improve</text>
  </g>

  <g transform="translate(160 300)">
    <rect x="0" y="0" width="960" height="56" rx="18" fill="#0B1220" stroke="#334155"/>
    <rect class="bar" x="40" y="18" width="90" height="26" rx="6" fill="#38BDF8"/>
    <rect class="bar bar2" x="165" y="12" width="90" height="32" rx="6" fill="#60A5FA"/>
    <rect class="bar bar3" x="290" y="6" width="90" height="38" rx="6" fill="#8B5CF6"/>
    <rect class="bar bar4" x="415" y="16" width="90" height="28" rx="6" fill="#22C55E"/>
    <rect class="bar bar2" x="540" y="9" width="90" height="35" rx="6" fill="#F59E0B"/>
    <rect class="bar bar3" x="665" y="15" width="90" height="29" rx="6" fill="#EF4444"/>
    <rect class="bar bar4" x="790" y="5" width="90" height="39" rx="6" fill="#14B8A6"/>
  </g>

  <text x="640" y="395" text-anchor="middle" fill="#94A3B8" font-family="Fira Code,Consolas,monospace" font-size="15" font-weight="700">profile signal: DevOps engineering + cloud-native learning + competitive programming</text>
</svg>