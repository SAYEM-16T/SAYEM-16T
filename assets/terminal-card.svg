  </text>

  <!-- line 5 -->
  <text x="34" y="455" fill="#38bdf8" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="700" filter="url(#blueGlow)">
    sayem@cloud-native:~$ motto
