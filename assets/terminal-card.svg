<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#06101f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="terminalBorder" x1="24" y1="30" x2="1256" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.22 0 0 0 0 0.74 0 0 0 0 1 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <!-- outer background -->
  <rect width="1280" height="560" rx="28" fill="url(#pageBg)"/>

  <!-- terminal box -->
  <rect x="24" y="30" width="1232" height="500" rx="18" fill="#071224" stroke="url(#terminalBorder)" stroke-width="1.5"/>

  <!-- macOS dots -->
  <circle cx="46" cy="55" r="6.5" fill="#ff5f57"/>
  <circle cx="70" cy="55" r="6.5" fill="#ffbd2e"/>
  <circle cx="94" cy="55" r="6.5" fill="#28c840"/>

  <!-- line 1 -->
  <text x="34" y="95" fill="#38bdf8" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="700" filter="url(#blueGlow)">
    sayem@cloud-native:~$ whoami
  </text>
  <text x="34" y="135" fill="#E5E7EB" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="500">
    Md. Abu Sayem Rony — Junior DevOps Engineer @ Foodi
  </text>

  <!-- line 2 -->
  <text x="34" y="185" fill="#38bdf8" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="700" filter="url(#blueGlow)">
    sayem@cloud-native:~$ current_focus
  </text>
  <text x="34" y="225" fill="#E5E7EB" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="500">
    Kubernetes • AWS • CI/CD • Vault • ArgoCD • Grafana • ELK/EFK
  </text>

  <!-- line 3 -->
  <text x="34" y="275" fill="#38bdf8" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="700" filter="url(#blueGlow)">
    sayem@cloud-native:~$ devops_work
  </text>
  <text x="34" y="315" fill="#E5E7EB" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="500">
    K8s deployments | GitOps delivery | parallel pipelines | production support
  </text>

  <!-- line 4 -->
  <text x="34" y="365" fill="#38bdf8" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="700" filter="url(#blueGlow)">
    sayem@cloud-native:~$ cp_profile
  </text>
  <text x="34" y="405" fill="#E5E7EB" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="18" font-weight="500">
