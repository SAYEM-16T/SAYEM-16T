<svg width="1280" height="240" viewBox="0 0 1280 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="38%" stop-color="#0F172A" />
      <stop offset="72%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Soft overlay gradient -->
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.07" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.04" />
    </linearGradient>

    <!-- Ambient glows -->
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(210 70) rotate(0) scale(260 160)">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1060 85) rotate(0) scale(260 170)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(640 220) rotate(0) scale(520 90)">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <!-- Top highlight line -->
    <linearGradient id="topLine" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#22C55E" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0" />
    </linearGradient>

    <!-- Inner glass effect -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.045" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32" />
    </filter>

    <!-- Soft blur for ambient shapes -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- Main card -->
  <g filter="url(#shadow)">
    <rect width="1280" height="240" rx="30" fill="url(#bg)" />
  </g>

  <!-- Ambient glows -->
  <circle cx="210" cy="70" r="150" fill="url(#leftGlow)" filter="url(#blur)" />
  <circle cx="1060" cy="85" r="150" fill="url(#rightGlow)" filter="url(#blur)" />
  <ellipse cx="640" cy="225" rx="430" ry="45" fill="url(#bottomGlow)" filter="url(#blur)" />

  <!-- Subtle texture -->
  <rect width="1280" height="240" rx="30" fill="url(#overlay)" />
  <rect width="1280" height="240" rx="30" fill="url(#grid)" opacity="0.22" />

  <!-- Glass layer -->
  <rect x="12" y="12" width="1256" height="216" rx="24" fill="url(#glass)" />

  <!-- Premium border -->
  <rect x="1.5" y="1.5" width="1277" height="237" rx="28.5" fill="none" stroke="#334155" stroke-opacity="0.7" />
  <line x1="85" y1="26" x2="1195" y2="26" stroke="url(#topLine)" stroke-width="2" />

  <!-- Text -->
  <text x="640" y="82" text-anchor="middle" fill="#38BDF8"
        font-family="Inter, Segoe UI, Arial" font-size="28" font-weight="900">
    ⚡ Operating Principle
  </text>

  <text x="640" y="145" text-anchor="middle" fill="white"
        font-family="Inter, Segoe UI, Arial" font-size="30" font-weight="900">
    try to use a system — never be used by a system
  </text>

  <text x="640" y="188" text-anchor="middle" fill="#CBD5E1"
        font-family="Inter, Segoe UI, Arial" font-size="16" font-weight="600">
    Think • Build • Debug • Improve • Repeat
  </text>
</svg>