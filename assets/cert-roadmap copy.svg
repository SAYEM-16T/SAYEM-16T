<svg width="1280" height="430" viewBox="0 0 1280 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Border -->
    <linearGradient id="frame" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Soft glows -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(170 80) rotate(90) scale(120 180)">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1110 90) rotate(90) scale(130 200)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Track gradient -->
    <linearGradient id="track" x1="120" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Arrow -->
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60A5FA"/>
    </marker>

    <!-- Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="430" rx="30" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1277" height="427" rx="28.5" fill="none" stroke="url(#frame)" stroke-opacity="0.30"/>
  <ellipse cx="170" cy="80" rx="200" ry="120" fill="url(#glowLeft)"/>
  <ellipse cx="1110" cy="90" rx="220" ry="130" fill="url(#glowRight)"/>

  <!-- Header -->
  <text x="640" y="58" text-anchor="middle" fill="#F8FAFC"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="34" font-weight="900">
    Cloud-Native Certification Roadmap
  </text>

  <text x="640" y="84" text-anchor="middle" fill="#94A3B8"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="16" font-weight="600">
    Planned learning path from AWS fundamentals to deeper Kubernetes and cloud-native expertise
  </text>

  <line x1="420" y1="102" x2="860" y2="102" stroke="#1E293B" stroke-width="2"/>
  <line x1="500" y1="102" x2="780" y2="102" stroke="#475569" stroke-width="2"/>

  <!-- Main Track -->
  <g filter="url(#softShadow)">
    <rect x="105" y="205" width="1070" height="10" rx="5" fill="#0F172A" stroke="#1E293B"/>
    <rect x="105" y="205" width="1070" height="10" rx="5" fill="url(#track)" fill-opacity="0.22"/>
  </g>

  <!-- Connector arrows -->
  <g stroke="#60A5FA" stroke-width="3" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path d="M190 210 H255"/>
    <path d="M375 210 H440"/>
    <path d="M560 210 H625"/>
    <path d="M745 210 H810"/>
    <path d="M930 210 H995"/>
  </g>

  <!-- Node 1 -->
  <g transform="translate(90 145)" filter="url(#shadow)">
    <rect x="6" y="-28" width="78" height="24" rx="12" fill="#2A1602" stroke="#7C2D12"/>
    <text x="45" y="-12" text-anchor="middle" fill="#FCD34D"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11" font-weight="800">STEP 1</text>

    <circle cx="45" cy="60" r="50" fill="#1F2937" stroke="#3F3F46"/>
    <circle cx="45" cy="60" r="43" fill="#FF9900"/>
    <text x="45" y="58" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="18" font-weight="900">AWS</text>
    <text x="45" y="78" text-anchor="middle" fill="#FFF7ED"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="800">SAA</text>

    <text x="45" y="132" text-anchor="middle" fill="#E2E8F0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" font-weight="800">Solutions Architect</text>
    <text x="45" y="149" text-anchor="middle" fill="#94A3B8"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700">Associate</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(275 145)" filter="url(#shadow)">
    <rect x="6" y="-28" width="78" height="24" rx="12" fill="#082F49" stroke="#0EA5E9"/>
    <text x="45" y="-12" text-anchor="middle" fill="#BAE6FD"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11" font-weight="800">STEP 2</text>

    <circle cx="45" cy="60" r="50" fill="#1F2937" stroke="#3F3F46"/>
    <circle cx="45" cy="60" r="43" fill="#326CE5"/>
    <text x="45" y="65" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="16" font-weight="900">KCNA</text>

    <text x="45" y="132" text-anchor="middle" fill="#E2E8F0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" font-weight="800">Kubernetes</text>
    <text x="45" y="149" text-anchor="middle" fill="#94A3B8"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700">Cloud Native Associate</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(460 145)" filter="url(#shadow)">
    <rect x="6" y="-28" width="78" height="24" rx="12" fill="#082F49" stroke="#2563EB"/>
    <text x="45" y="-12" text-anchor="middle" fill="#BFDBFE"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11" font-weight="800">STEP 3</text>

    <circle cx="45" cy="60" r="50" fill="#1F2937" stroke="#3F3F46"/>
    <circle cx="45" cy="60" r="43" fill="#2563EB"/>
    <text x="45" y="65" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="16" font-weight="900">KCSA</text>

    <text x="45" y="132" text-anchor="middle" fill="#E2E8F0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" font-weight="800">Kubernetes &amp; Cloud Native</text>
    <text x="45" y="149" text-anchor="middle" fill="#94A3B8"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700">Security Associate</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(645 145)" filter="url(#shadow)">
    <rect x="6" y="-28" width="78" height="24" rx="12" fill="#2E1065" stroke="#7C3AED"/>
    <text x="45" y="-12" text-anchor="middle" fill="#DDD6FE"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11" font-weight="800">STEP 4</text>

    <circle cx="45" cy="60" r="50" fill="#1F2937" stroke="#3F3F46"/>
    <circle cx="45" cy="60" r="43" fill="#7C3AED"/>
    <text x="45" y="65" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="16" font-weight="900">CKAD</text>

    <text x="45" y="132" text-anchor="middle" fill="#E2E8F0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" font-weight="800">Certified Kubernetes</text>
    <text x="45" y="149" text-anchor="middle" fill="#94A3B8"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700">Application Developer</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(830 145)" filter="url(#shadow)">
    <rect x="6" y="-28" width="78" height="24" rx="12" fill="#082F49" stroke="#0EA5E9"/>
    <text x="45" y="-12" text-anchor="middle" fill="#BAE6FD"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11" font-weight="800">STEP 5</text>

    <circle cx="45" cy="60" r="50" fill="#1F2937" stroke="#3F3F46"/>
    <circle cx="45" cy="60" r="43" fill="#0EA5E9"/>
    <text x="45" y="65" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="18" font-weight="900">CKA</text>

    <text x="45" y="132" text-anchor="middle" fill="#E2E8F0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" font-weight="800">Certified Kubernetes</text>
    <text x="45" y="149" text-anchor="middle" fill="#94A3B8"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700">Administrator</text>
  </g>

  <!-- Node 6 -->
  <g transform="translate(1015 145)" filter="url(#shadow)">
    <rect x="6" y="-28" width="78" height="24" rx="12" fill="#052E16" stroke="#16A34A"/>
    <text x="45" y="-12" text-anchor="middle" fill="#BBF7D0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11" font-weight="800">STEP 6</text>

    <circle cx="45" cy="60" r="50" fill="#1F2937" stroke="#3F3F46"/>
    <circle cx="45" cy="60" r="43" fill="#16A34A"/>
    <text x="45" y="65" text-anchor="middle" fill="#FFFFFF"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="18" font-weight="900">CKS</text>

    <text x="45" y="132" text-anchor="middle" fill="#E2E8F0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="13" font-weight="800">Certified Kubernetes</text>
    <text x="45" y="149" text-anchor="middle" fill="#94A3B8"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12" font-weight="700">Security Specialist</text>
  </g>

  <!-- Bottom Goal -->
  <g filter="url(#softShadow)">
    <rect x="225" y="356" width="830" height="38" rx="19" fill="#0B1220" stroke="#1E293B"/>
    <text x="640" y="380" text-anchor="middle" fill="#CBD5E1"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="15" font-weight="700">
      Goal: build strong AWS fundamentals and grow into a deeper Kubernetes and cloud-native engineer
    </text>
  </g>
</svg>