<!-- =========================
     DEFINITIONS
     Background, gradients, glow, grid pattern
     ========================= -->
<defs>

    <!-- Main premium dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#020617" />
        <stop offset="45%" stop-color="#07111F" />
        <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Subtle frame gradient -->
    <linearGradient id="frame" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
        <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.18" />
    </linearGradient>

    <!-- Middle connector line gradient -->
    <linearGradient id="l" x1="0" x2="1">
        <stop stop-color="#38BDF8" />
        <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Subtle grid pattern for background -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#94A3B8" stroke-width="0.6" opacity="0.08"/>
    </pattern>

    <!-- Soft glow filter -->
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="42" />
    </filter>

    <!-- Card shadow -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
        <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

</defs>

<!-- =========================
     MAIN BACKGROUND
     Premium dark background + subtle grid + ambient glow
     ========================= -->
<rect width="1280" height="420" rx="30" fill="url(#bg)" />

<!-- Soft ambient glows -->
<circle cx="170" cy="80" r="110" fill="#38BDF8" fill-opacity="0.10" filter="url(#blurGlow)" />
<circle cx="1110" cy="90" r="120" fill="#8B5CF6" fill-opacity="0.12" filter="url(#blurGlow)" />
<circle cx="640" cy="420" r="180" fill="#2563EB" fill-opacity="0.07" filter="url(#blurGlow)" />

<!-- Subtle grid overlay -->
<rect width="1280" height="420" rx="30" fill="url(#grid)" opacity="0.65" />

<!-- Premium outer border -->
<rect x="1.5" y="1.5" width="1277" height="417" rx="28.5" fill="none" stroke="url(#frame)" stroke-width="1.5" />

